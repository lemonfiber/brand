[default]
# Ignore hotkey mockup notation like [e]rror, [s]ervice in TUI examples.
extend-ignore-re = ["\\[[a-z]\\][a-zA-Z]+"]

[default.extend-words]
ratatui = "ratatui"
Ratatui = "Ratatui"
lemonfiber = "lemonfiber"
Servarr = "Servarr"

# --- what this repository adds -------------------------------------------
#
# Everything above is the canonical floor and is byte-identical across the
# estate. What follows is this tree's own, which the floor explicitly permits.

[files]
# The brand documentation lives under `.docs/`, and this checker skips hidden
# directories by default — so every word in it was going unread, with the gate
# green the whole time. That is the failure mode a spell check exists to prevent
# rather than an acceptable gap in one.
#
# `.git` has to come back out by hand once hidden files are in: its object files
# are compressed binary, and the checker reads them as a long list of
# misspellings that no edit can ever fix.
ignore-hidden = false
extend-exclude = [".git/"]
