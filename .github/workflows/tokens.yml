name: tokens
on: [pull_request]
permissions:
  contents: read
# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      # The script before the arithmetic. Everything below is decided by one
      # file that nothing read — and an undefined name in it reads as a token
      # that does not match, not as a checker that does not run.
      - name: The gate script itself
        run: pipx run ruff==0.16.4 check scripts/

      # The arithmetic before what it decides. Parity compares two values
      # somebody wrote down; contrast computes one, and a wrong answer is the
      # only kind here that ships a colour nobody can read while reporting that
      # every pairing meets AA.
      - name: The contrast arithmetic matches WCAG
        run: python3 scripts/check_tokens.py --self-test

      - name: Token parity + contrast
        run: python3 scripts/check_tokens.py
